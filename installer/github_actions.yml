# ============================================================================
# Quorum CI/CD — Multi-Platform Build & Release
#
# Triggers:
#   - Tag push (v*): Full build + release to GitHub Releases
#   - Push to main: CI build only (--no-llama for speed)
#   - Pull request: CI build verification
#
# Builds for all 3 platforms:
#   - Windows (x86_64): NSIS installer (.exe)
#   - macOS (arm64 + x86_64): DMG disk image
#   - Linux (x86_64): .deb package + AppImage
#
# All artifacts are checksummed and published to GitHub Releases on tag push.
# ============================================================================

name: Quorum CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_llama:
        description: "Bundle llama-server in the build"
        type: boolean
        default: true
      publish_release:
        description: "Publish to GitHub Releases"
        type: boolean
        default: false

# Cancel in-progress runs on the same branch/tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  QUORUM_BUILD_COMMIT: ${{ github.sha }}

# ============================================================================
# Jobs
# ============================================================================

jobs:
  # --------------------------------------------------------------------------
  # Test: Run unit tests on all platforms
  # --------------------------------------------------------------------------
  test:
    name: "Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest quorum_core/tests/ -v --tb=short --cov=quorum_core --cov-report=xml

      - name: Upload coverage (ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # --------------------------------------------------------------------------
  # Build: Build executable for all platforms
  # --------------------------------------------------------------------------
  build:
    name: "Build (${{ matrix.target }})"
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            os: windows-latest
            artifact: Quorum.exe
            installer: nsis
          - target: macos-arm64
            os: macos-latest
            artifact: Quorum.app
            installer: dmg
          - target: linux-x86_64
            os: ubuntu-latest
            artifact: Quorum
            installer: deb

    env:
      # Disable llama download in CI unless tagged release or forced
      QUORUM_BUILD_NO_LLAMA: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && inputs.build_llama != false }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # --- Windows-specific setup ---
      - name: Install NSIS (Windows)
        if: matrix.target == 'windows-x86_64'
        run: choco install nsis -y --no-progress

      # --- Linux-specific setup ---
      - name: Install dpkg (Linux)
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev fakeroot

      # --- macOS-specific setup ---
      - name: Set macOS deployment target
        if: matrix.target == 'macos-arm64'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV

      # --- Common build steps ---
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller>=6.0.0

      - name: Build executable
        shell: bash
        run: |
          BUILD_FLAGS=""
          if [[ "${GITHUB_REF_TYPE}" != "tag" && "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            BUILD_FLAGS="--no-llama"
            echo "CI build: skipping llama-server bundling (--no-llama)"
          fi
          python build/build_exe.py $BUILD_FLAGS

      - name: Verify executable
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "windows-x86_64" ]; then
            ls -lh dist/Quorum.exe
          elif [ "${{ matrix.target }}" = "macos-arm64" ]; then
            ls -lh dist/Quorum.app/Contents/MacOS/Quorum
          else
            ls -lh dist/Quorum
          fi

      - name: Upload build artifact (binary only)
        uses: actions/upload-artifact@v4
        with:
          name: quorum-${{ matrix.target }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Package: Build platform-specific installers
  # --------------------------------------------------------------------------
  package:
    name: "Package (${{ matrix.target }})"
    runs-on: ${{ matrix.os }}
    needs: [build]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            os: windows-latest
            binary_artifact: quorum-windows-x86_64
            output_files: "dist/Quorum-Setup-*.exe"
          - target: macos-arm64
            os: macos-latest
            binary_artifact: quorum-macos-arm64
            output_files: "dist/Quorum-*.dmg"
          - target: linux-x86_64
            os: ubuntu-latest
            binary_artifact: quorum-linux-x86_64
            output_files: "dist/quorum_*_amd64.deb dist/Quorum-*.AppImage"

    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binary_artifact }}
          path: dist/

      # --- Windows: NSIS packaging ---
      - name: Install NSIS (Windows)
        if: matrix.target == 'windows-x86_64'
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer (Windows)
        if: matrix.target == 'windows-x86_64'
        shell: bash
        run: |
          makensis /DVERSION="${GITHUB_REF_NAME#v}" /DBUILD_DIR=dist installer/nsis/quorum.nsi
        continue-on-error: true

      - name: Build NSIS installer (fallback path)
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION="$version" /DBUILD_DIR="dist" installer\nsis\quorum.nsi
        continue-on-error: true

      # --- macOS: DMG packaging ---
      - name: Make DMG build script executable (macOS)
        if: matrix.target == 'macos-arm64'
        run: chmod +x installer/dmg/build_dmg.sh

      - name: Build DMG (macOS)
        if: matrix.target == 'macos-arm64'
        shell: bash
        run: |
          ./installer/dmg/build_dmg.sh
        continue-on-error: true

      # --- Linux: .deb packaging ---
      - name: Make DEB build script executable (Linux)
        if: matrix.target == 'linux-x86_64'
        run: |
          chmod +x installer/deb/build_deb.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev fakeroot

      - name: Build .deb package (Linux)
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          ./installer/deb/build_deb.sh

      # --- Upload package artifacts ---
      - name: List output files
        shell: bash
        run: |
          echo "Package outputs:"
          find dist/ -maxdepth 1 -type f -exec ls -lh {} \;

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quorum-packages-${{ matrix.target }}
          path: ${{ matrix.output_files }}
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # Release: Publish to GitHub Releases (tag push only)
  # --------------------------------------------------------------------------
  release:
    name: "Release to GitHub"
    runs-on: ubuntu-latest
    needs: [package]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: quorum-packages-*
          path: dist/
          merge-multiple: true

      - name: List release artifacts
        run: |
          echo "=== Release artifacts ==="
          find dist/ -maxdepth 1 -type f -exec ls -lh {} \;

      - name: Generate checksums
        run: |
          cd dist/
          sha256sum * > SHA256SUMS 2>/dev/null || true
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Quorum ${{ github.ref_name }}"
          body: |
            ## Quorum ${{ github.ref_name }}

            ### Downloads
            - **Windows**: `Quorum-Setup-${{ github.ref_name }}.exe` (NSIS installer)
            - **macOS**: `Quorum-${{ github.ref_name }}.dmg`
            - **Linux**: `quorum_${{ github.ref_name }}_amd64.deb` + AppImage

            ### SHA256 Checksums
            See `SHA256SUMS` for file integrity verification.

            ### What's Changed
            - Automated release from CI pipeline
            - Bundled with Hermes desktop framework
            - Includes llama-server for local LLM inference

            ### Verify Integrity
            ```bash
            # Verify a downloaded file
            sha256sum -c SHA256SUMS --ignore-missing

            # Or use our checksum tool
            python installer/checksums.py verify dist/ --manifest SHA256SUMS
            ```
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # Checksum verification (post-release smoke test)
  # --------------------------------------------------------------------------
  verify-checksums:
    name: "Verify Checksums"
    runs-on: ubuntu-latest
    needs: [release]
    if: github.ref_type == 'tag'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download release artifacts for verification
        uses: robinraju/release-downloader@v1.10
        with:
          tag: ${{ github.ref_name }}
          fileName: "*"
          out-file-path: "release-artifacts"
        continue-on-error: true

      - name: Verify checksums
        run: |
          python installer/checksums.py verify release-artifacts/ --manifest release-artifacts/SHA256SUMS
        continue-on-error: true

  # --------------------------------------------------------------------------
  # Docker build (optional, for container-based deployments)
  # --------------------------------------------------------------------------
  docker:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: quorum-linux-x86_64
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: installer/Dockerfile
          push: false  # Set to true when GHCR credentials are configured
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            QUORUM_VERSION=${{ github.ref_name }}